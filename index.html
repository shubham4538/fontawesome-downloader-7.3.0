    <script src="https://unpkg.com/html-to-image@1.11.13/dist/html-to-image.js"></script>
    <script>
      async function downloadAllIcon() {
        const size = parseInt(document.getElementById("imageSize").value);
        const icons = document.querySelectorAll("i");

        // Make sure fonts are loaded
        await document.fonts.ready;

        // Capture each icon's data FIRST
        const iconData = Array.from(icons).map((icon) => {
          const before = getComputedStyle(icon, "::before");

          return {
            content: before.content.replace(/['"]/g, "").replace("/", ""),
            fontFamily: before.fontFamily || getComputedStyle(icon).fontFamily,
            fontWeight: before.fontWeight || getComputedStyle(icon).fontWeight,
            fontStyle: before.fontStyle || getComputedStyle(icon).fontStyle,
            color: icon.style.color,
          };
        });

        // Now generate each icon
        iconData.forEach((data, index) => {
          setTimeout(() => {
            const canvas = document.createElement("canvas");
            canvas.width = size;
            canvas.height = size;

            const ctx = canvas.getContext("2d");

            ctx.font = `${data.fontStyle} ${data.fontWeight} ${size * 0.8}px ${data.fontFamily}`;
            ctx.fillStyle = data.color;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            ctx.fillText(data.content, size * 0.7, size / 2);

            const a = document.createElement("a");
            a.href = canvas.toDataURL("image/png");
            a.download = `icon-${index + 1}-${size}.png`;

            a.click();
          }, index * 500);
        });
      }

      async function downloadIcon(icon) {
        const size = parseInt(document.getElementById("imageSize").value, 10);
        await document.fonts.ready;

        // ADDED: clone so the visible icon is not resized
        const clone = icon.cloneNode(true);
        const wrapper = document.createElement("div");

        Object.assign(wrapper.style, {
          position: "fixed",
          left: "0",
          top: "0",
          zindex: "-9999",
          width: `${size}px`,
          height: `${size}px`,
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          background: "transparent",
        });

        // ADDED: preserve the icon’s classes and associated font file
        Object.assign(clone.style, {
          position: "relative",
          display: "inline-block",
          fontSize: `${size * 0.8}px`,
          lineHeight: "1",
        });

        wrapper.appendChild(clone);
        document.body.appendChild(wrapper);

        try {
          // ADDED: captures ::before and ::after as rendered
          const png = await htmlToImage.toPng(wrapper, {
            width: size,
            height: size,
            pixelRatio: 1,
            backgroundColor: "transparent",
            cacheBust: true,
          });

          const a = document.createElement("a");
          a.href = png;
          a.download = `icon-${size}.png`;
          a.click();
        } finally {
          wrapper.remove();
        }
      }

      let prevoiusIconClass = null;
      function changeIcon() {
        const color = document.getElementById("iconColor").value;
        const iconStyle = document.getElementById("iconstyle").value;
        const iconName = `fa-${iconStyle}`;
        const icons = document.querySelectorAll("i");
        icons.forEach((icon) => {
          if (prevoiusIconClass) {
            icon.classList.remove(prevoiusIconClass);
            icon.style.color = color;
          }
          icon.classList.add(iconName);
        });
        prevoiusIconClass = iconName;
      }
